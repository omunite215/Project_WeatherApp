<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 960" width="1400" height="960" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <!-- opaque backdrop so the diagram stays legible on GitHub's dark theme -->
  <rect width="1400" height="960" fill="#ffffff"/>

  <text x="700" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">Omi&#8217;s Weather &#8212; System Architecture</text>
  <text x="700" y="68" text-anchor="middle" font-size="13" fill="#64748b">Next.js 16 · React 19 · TanStack Query · Zustand · xior · Zod · Tailwind 4</text>

  <!-- ================= BROWSER ================= -->
  <rect x="30" y="92" width="1340" height="286" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="52" y="120" font-size="14" font-weight="700" fill="#1e40af">BROWSER</text>

  <text x="52" y="146" font-size="11" font-style="italic" fill="#3b82f6">Client Components</text>
  <g font-size="12" fill="#0f172a" text-anchor="middle">
    <rect x="52" y="156" width="176" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
    <text x="140" y="176">Navbar</text><text x="140" y="192" font-size="11" fill="#475569">CitySearch</text>

    <rect x="242" y="156" width="176" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
    <text x="330" y="176">Hero</text><text x="330" y="192" font-size="11" fill="#475569">GSAP counter</text>

    <rect x="432" y="156" width="176" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
    <text x="520" y="176">MetricGrid</text><text x="520" y="192" font-size="11" fill="#475569">RainCard</text>

    <rect x="622" y="156" width="176" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
    <text x="710" y="176">ForecastPanel</text><text x="710" y="192" font-size="11" fill="#475569">Chart · DayChips</text>

    <rect x="812" y="156" width="176" height="46" rx="8" fill="#fff" stroke="#3b82f6"/>
    <text x="900" y="176">StatusBar</text><text x="900" y="192" font-size="11" fill="#475569">offline · staleness</text>
  </g>

  <!-- Zustand -->
  <rect x="1018" y="150" width="200" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="1118" y="172" text-anchor="middle" font-size="12" font-weight="600" fill="#78350f">Zustand</text>
  <text x="1118" y="190" text-anchor="middle" font-size="10.5" fill="#92400e">units · favourites · recents</text>

  <rect x="1240" y="150" width="112" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-dasharray="4 3"/>
  <text x="1296" y="176" text-anchor="middle" font-size="11" fill="#78350f">localStorage</text>
  <text x="1296" y="192" text-anchor="middle" font-size="10" fill="#92400e">persisted</text>
  <line x1="1218" y1="179" x2="1240" y2="179" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Hooks -->
  <text x="52" y="228" font-size="11" font-style="italic" fill="#3b82f6">Hooks &#8212; the only data surface components import (DIP)</text>
  <rect x="52" y="236" width="936" height="38" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="520" y="260" text-anchor="middle" font-size="12" fill="#1e3a8a">useWeather · useForecast · useAirQuality · useCitySearch · useGeolocation</text>

  <!-- Query + xior -->
  <rect x="52" y="292" width="620" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="362" y="314" text-anchor="middle" font-size="12.5" font-weight="600" fill="#14532d">TanStack Query v5</text>
  <text x="362" y="332" text-anchor="middle" font-size="10.5" fill="#166534">cache · dedupe · backoff · no retry on 404 · staleTime 5m</text>

  <rect x="700" y="292" width="176" height="52" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="788" y="314" text-anchor="middle" font-size="12.5" font-weight="600" fill="#581c87">xior (browser)</text>
  <text x="788" y="332" text-anchor="middle" font-size="10.5" fill="#6b21a8">baseURL: /api</text>

  <line x1="520" y1="202" x2="520" y2="236" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="300" y1="274" x2="300" y2="292" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="672" y1="318" x2="700" y2="318" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="988" y1="179" x2="1018" y2="179" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <!-- ================= TRUST BOUNDARY ================= -->
  <line x1="30" y1="398" x2="1370" y2="398" stroke="#dc2626" stroke-width="3" stroke-dasharray="10 6"/>
  <rect x="386" y="384" width="628" height="28" rx="6" fill="#ffffff"/>
  <text x="700" y="403" text-anchor="middle" font-size="13" font-weight="700" fill="#dc2626">TRUST BOUNDARY &#8212; the API key never crosses upward into the client bundle</text>

  <!-- ================= SERVER ================= -->
  <rect x="30" y="424" width="1340" height="356" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="52" y="452" font-size="14" font-weight="700" fill="#15803d">NEXT.JS SERVER (Node runtime)</text>

  <rect x="52" y="466" width="230" height="52" rx="8" fill="#fff" stroke="#15803d"/>
  <text x="167" y="487" text-anchor="middle" font-size="12" fill="#0f172a">app/page.tsx &#8212; RSC</text>
  <text x="167" y="504" text-anchor="middle" font-size="10.5" fill="#475569">reads ?lat&amp;lon from URL</text>

  <rect x="306" y="466" width="238" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="425" y="487" text-anchor="middle" font-size="12" fill="#14532d">prefetchWeatherData()</text>
  <text x="425" y="504" text-anchor="middle" font-size="10.5" fill="#166534">pending queries dehydrated</text>

  <rect x="568" y="466" width="212" height="52" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="674" y="487" text-anchor="middle" font-size="12" fill="#14532d">HydrationBoundary</text>
  <text x="674" y="504" text-anchor="middle" font-size="10.5" fill="#166534">streamed to the client</text>

  <line x1="282" y1="492" x2="306" y2="492" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="544" y1="492" x2="568" y2="492" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 674 466 L 674 440 L 362 440 L 362 344" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="700" y="436" font-size="10" fill="#15803d">hydrates the cache &#8212; no client refetch</text>

  <!-- Route handlers -->
  <text x="52" y="546" font-size="11" font-style="italic" fill="#15803d">Route Handlers &#8212; app/api/*</text>
  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <rect x="52" y="556" width="168" height="44" rx="8" fill="#fff" stroke="#15803d"/>
    <text x="136" y="575">GET /api/weather</text><text x="136" y="590" font-size="10" fill="#475569">?lat&amp;lon</text>

    <rect x="234" y="556" width="168" height="44" rx="8" fill="#fff" stroke="#15803d"/>
    <text x="318" y="575">GET /api/forecast</text><text x="318" y="590" font-size="10" fill="#475569">?lat&amp;lon</text>

    <rect x="416" y="556" width="168" height="44" rx="8" fill="#fff" stroke="#15803d"/>
    <text x="500" y="575">GET /api/air-quality</text><text x="500" y="590" font-size="10" fill="#475569">?lat&amp;lon</text>

    <rect x="598" y="556" width="168" height="44" rx="8" fill="#fff" stroke="#15803d"/>
    <text x="682" y="575">GET /api/geo</text><text x="682" y="590" font-size="10" fill="#475569">?q | ?lat&amp;lon</text>
  </g>

  <line x1="788" y1="344" x2="788" y2="384" stroke="#9333ea" stroke-width="2"/>
  <line x1="788" y1="412" x2="788" y2="556" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="798" y="540" font-size="10" fill="#6b21a8">HTTPS</text>
  <rect x="784" y="556" width="0" height="0"/>

  <rect x="800" y="548" width="240" height="60" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="920" y="568" text-anchor="middle" font-size="11.5" font-weight="600" fill="#7f1d1d">route-helpers.ts</text>
  <text x="920" y="584" text-anchor="middle" font-size="10" fill="#991b1b">Zod query parse · withErrorHandling</text>
  <text x="920" y="598" text-anchor="middle" font-size="10" fill="#991b1b">404→NOT_FOUND · 401→INVALID_KEY</text>

  <!-- Adapter row -->
  <rect x="52" y="632" width="320" height="66" rx="8" fill="#ffedd5" stroke="#ea580c"/>
  <text x="212" y="654" text-anchor="middle" font-size="12" font-weight="600" fill="#7c2d12">lib/api/openweather.ts</text>
  <text x="212" y="670" text-anchor="middle" font-size="10.5" font-style="italic" fill="#9a3412">import "server-only"</text>
  <text x="212" y="686" text-anchor="middle" font-size="10.5" fill="#9a3412">wire → domain · day grouping</text>

  <rect x="404" y="632" width="230" height="66" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="519" y="654" text-anchor="middle" font-size="12" font-weight="600" fill="#7f1d1d">schemas/openweather.ts</text>
  <text x="519" y="670" text-anchor="middle" font-size="10.5" fill="#991b1b">Zod response validation</text>
  <text x="519" y="686" text-anchor="middle" font-size="10.5" fill="#991b1b">bad payload → INVALID_RESPONSE</text>

  <rect x="666" y="632" width="222" height="66" rx="8" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="777" y="654" text-anchor="middle" font-size="12" font-weight="600" fill="#581c87">xior (server)</text>
  <text x="777" y="670" text-anchor="middle" font-size="10.5" fill="#6b21a8">next: { revalidate }</text>
  <text x="777" y="686" text-anchor="middle" font-size="10.5" fill="#6b21a8">weather 10m · geo 24h</text>

  <rect x="920" y="632" width="150" height="66" rx="8" fill="#f3e8ff" stroke="#9333ea" stroke-dasharray="4 3"/>
  <text x="995" y="662" text-anchor="middle" font-size="11" fill="#581c87">Next.js</text>
  <text x="995" y="678" text-anchor="middle" font-size="11" fill="#581c87">Data Cache</text>

  <rect x="1102" y="626" width="250" height="78" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1227" y="654" text-anchor="middle" font-size="11.5" font-weight="700" fill="#7f1d1d">OPENWEATHER_API_KEY</text>
  <text x="1227" y="672" text-anchor="middle" font-size="10" fill="#991b1b">server env only</text>
  <text x="1227" y="688" text-anchor="middle" font-size="10" fill="#991b1b">no NEXT_PUBLIC_ prefix</text>

  <line x1="136" y1="600" x2="136" y2="632" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 306 492 L 40 492 L 40 665 L 52 665" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="60" y="616" font-size="9.5" fill="#9a3412">direct call &#8212; no self-HTTP</text>
  <line x1="372" y1="665" x2="404" y2="665" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="634" y1="665" x2="666" y2="665" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="888" y1="665" x2="920" y2="665" stroke="#9333ea" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="1102" y1="665" x2="1070" y2="665" stroke="#dc2626" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowRed)"/>

  <!-- ================= EXTERNAL ================= -->
  <rect x="30" y="800" width="1340" height="132" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="52" y="828" font-size="14" font-weight="700" fill="#6d28d9">OPENWEATHER (external &#8212; free tier)</text>

  <g font-size="11" fill="#0f172a" text-anchor="middle">
    <rect x="52" y="844" width="212" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
    <text x="158" y="866">/data/2.5/weather</text><text x="158" y="882" font-size="10" fill="#475569">current conditions</text>

    <rect x="284" y="844" width="212" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
    <text x="390" y="866">/data/2.5/forecast</text><text x="390" y="882" font-size="10" fill="#475569">40 × 3-hour slots</text>

    <rect x="516" y="844" width="236" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
    <text x="634" y="866">/data/2.5/air_pollution</text><text x="634" y="882" font-size="10" fill="#475569">AQI 1–5, replaces paid UV</text>

    <rect x="772" y="844" width="268" height="52" rx="8" fill="#fff" stroke="#7c3aed"/>
    <text x="906" y="866">/geo/1.0/direct · /reverse</text><text x="906" y="882" font-size="10" fill="#475569">autocomplete &amp; reverse lookup</text>
  </g>

  <rect x="1102" y="840" width="250" height="60" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-dasharray="4 3"/>
  <text x="1227" y="862" text-anchor="middle" font-size="11" font-weight="600" fill="#6b7280">Not available on the free tier</text>
  <text x="1227" y="880" text-anchor="middle" font-size="10" fill="#6b7280">UV index (One Call 3.0) · history</text>

  <line x1="777" y1="698" x2="777" y2="844" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="787" y="790" font-size="10" fill="#6d28d9">HTTPS + appid</text>

  <text x="700" y="950" text-anchor="middle" font-size="10.5" fill="#94a3b8">Editable source: docs/architecture.drawio &#8212; open at app.diagrams.net</text>
</svg>
